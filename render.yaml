databases:
  - name: sec-whatsapp-db
    plan: free
    databaseName: sec_whatsapp
    user: sec_whatsapp

services:
  - type: web
    name: sec-whatsapp-bot
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run build && npm run db:seed
    startCommand: npm run start
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sec-whatsapp-db
          property: connectionString
      - key: NEXT_PUBLIC_BASE_URL
        value: https://sec-whatsapp-bot.onrender.com
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: META_WHATSAPP_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_PHONE_NUMBER_DISPLAY
        sync: false
      - key: META_WABA_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FEATURE_TIER1_ELIGIBILITY_ENABLED
        value: "true"
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
